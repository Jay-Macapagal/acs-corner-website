<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ACS Corner PH</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--tx:#1f1e1c;--mu:#6b6a65;--bd:#e3e0d8;--ac:#0f6e56;--acbg:#e1f5ee;--wr:#854f0b;--wrbg:#faeeda;--dg:#a32d2d;--dgbg:#fcebeb;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1b19;--card:#262522;--tx:#efede6;--mu:#a3a198;--bd:#3d3b36;--ac:#5dcaa5;--acbg:#04342c;--wr:#fac775;--wrbg:#412402;--dg:#f09595;--dgbg:#501313;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1b19;--card:#262522;--tx:#efede6;--mu:#a3a198;--bd:#3d3b36;--ac:#5dcaa5;--acbg:#04342c;--wr:#fac775;--wrbg:#412402;--dg:#f09595;--dgbg:#501313;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:20px;font-weight:600;margin:0 0 12px}h2{font-size:15px;font-weight:600;margin:18px 0 8px}h2:first-child{margin-top:0}
nav{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--bd);margin-bottom:16px}
nav button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:8px 12px;color:var(--mu);white-space:nowrap}
nav button.on{color:var(--ac);border-bottom-color:var(--ac);font-weight:600}
button,input,select,textarea{font:inherit;color:var(--tx)}
button{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 14px;cursor:pointer}
button.pri{background:var(--ac);color:var(--bg);border-color:var(--ac)}
button.sm{padding:3px 10px;font-size:13px}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 10px}
label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--mu);margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1;min-width:120px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:10px}
.stats .card{margin:0}.stats b{font-size:18px}
.pill{font-size:12px;padding:1px 9px;border-radius:99px;background:var(--acbg);color:var(--ac)}
.pill.w{background:var(--wrbg);color:var(--wr)}.pill.d{background:var(--dgbg);color:var(--dg)}
.mu{color:var(--mu);font-size:13px}.empty{color:var(--mu);padding:12px 0}
.th{width:44px;height:44px;border-radius:8px;background:var(--bd);object-fit:cover;flex:none}
.note{background:var(--wrbg);color:var(--wr);border-radius:8px;padding:8px 12px;margin-bottom:8px;font-size:13px}
.warn{border-color:var(--wr)}
.tab{display:none}.tab.show{display:block}
.num{width:120px}
details{margin-top:24px;color:var(--mu);font-size:13px}details .row{margin-top:8px}
</style></head><body><main>
<h1>ACS Corner PH</h1>
<div id="notes"></div>
<nav id="nav"></nav>

<section class="tab" id="t-res">
<div class="card"><form id="rForm">
<label>Shoe name or keyword<input name="iname" required placeholder="pandadunks"></label>
<label>Miners in order, one per line (1st, 2nd, 3rd...)<textarea name="miners" rows="3" required placeholder="jho&#10;viv&#10;jul"></textarea></label>
<label>Delivery batch<select name="batch" id="rb"></select></label>
<label>Photo (optional)<input id="photo" type="file" accept="image/*" capture="environment"></label>
<button class="pri">Reserve for 24 hours</button></form></div>
<div id="dup"></div></section>

<section class="tab" id="t-q"><div id="q"></div></section>

<section class="tab" id="t-pos">
<h2>Waiting for payment</h2><div id="posr"></div>
<h2>Walk-in sale</h2>
<div class="card"><form id="wForm">
<label>Shoe name<input name="iname" required></label>
<label>Sold price<input name="price" type="number" min="1" required></label>
<label>Delivery batch<select name="batch" id="wb"></select></label>
<button class="pri">Record walk-in sale</button></form></div></section>

<section class="tab" id="t-inv"><div id="inv"></div></section>

<section class="tab" id="t-bat">
<div class="card"><form id="bForm">
<label>Delivery label<input name="label" required placeholder="Delivery Nov 20"></label>
<div class="row"><label class="grow">Pairs<input name="pairs" type="number" min="1" required></label>
<label class="grow">Total cost<input name="cost" type="number" min="0" required></label></div>
<button class="pri">Save delivery</button></form></div>
<div id="bats"></div></section>

<section class="tab" id="t-cr">
<div class="card"><form id="cForm">
<div class="row"><label class="grow">Person<input name="who" required list="ppl"></label>
<label class="grow">Amount<input name="amt" type="number" min="1" required></label></div>
<label>Reason<input name="why" placeholder="Damaged during delivery"></label>
<button class="pri">Add store credit</button></form><datalist id="ppl"></datalist></div>
<div id="cr"></div></section>

<details><summary>Demo tools</summary><div class="row">
<button class="sm" onclick="skip(1)">Skip 1 day</button><button class="sm" onclick="skip(7)">Skip 7 days</button><button class="sm" onclick="resetAll()">Reset demo data</button></div></details>
</main>
<script>
const DAY=864e5,H=36e5,KEY='acs_v3';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const peso=n=>'₱'+Number(n).toLocaleString('en-PH');
const norm=s=>s.toLowerCase().replace(/[^a-z0-9]/g,'');
const ord=n=>n===1?'1st':n===2?'2nd':n===3?'3rd':n+'th';
const item=id=>S.items.find(i=>i.id===id),bat=id=>S.batches.find(b=>b.id===id);
const open=r=>r.status==='ACTIVE'||r.status==='WAITING';
const bal=w=>S.credits.filter(c=>c.who.toLowerCase()===w.toLowerCase()).reduce((a,c)=>a+c.amt,0);
const batSales=id=>S.sales.filter(s=>!s.returned&&item(s.item)&&item(s.item).batch===id);
const empty=t=>`<div class="empty">${t}</div>`;
let S,tab='res',pend=null,photoData='',crKeys=[];

function seed(){const n=Date.now();return{nid:10,
batches:[{id:1,label:'Delivery Nov 4',pairs:100,cost:90000,added:n-16*DAY},{id:2,label:'Delivery Nov 18',pairs:100,cost:85000,added:n-2*DAY}],
items:[{id:3,name:'Nike Dunk Low Panda',photo:'',batch:1,status:'RESERVED'}],
res:[{id:4,item:3,who:'Ana',pos:1,status:'ACTIVE',exp:n+20*H}],sales:[],notes:[],
credits:[{id:5,who:'Ana',amt:500,why:'Item damaged in delivery',at:n-3*DAY}]}}
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function note(t){S.notes.unshift(t);S.notes=S.notes.slice(0,6)}
function commit(){checkAge();save();render()}
function setTab(t){tab=t;render()}
function resetAll(){S=seed();pend=null;commit()}
function skip(d){S.batches.forEach(b=>b.added-=d*DAY);S.res.forEach(r=>{if(r.exp)r.exp-=d*DAY});S.sales.forEach(s=>s.ret-=d*DAY);commit()}
function checkAge(){S.batches.forEach(b=>{const rem=b.pairs-batSales(b.id).length;if(!b.aged&&rem>0&&Math.floor((Date.now()-b.added)/DAY)>=14){b.aged=1;note(`${b.label} is 14 days old with about ${rem} pairs unsold. Consider a markdown.`)}})}

/* similarity for the duplicate warning */
const lev=(a,b)=>{const m=a.length,n=b.length;if(!m||!n)return Math.max(m,n);let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]};
function simil(a,b){const x=norm(a).replace(/s$/,''),y=norm(b).replace(/s$/,'');if(!x||!y)return 0;if(x.includes(y)||y.includes(x))return 1;
const tk=s=>s.toLowerCase().split(/[^a-z0-9]+/).filter(Boolean).map(w=>w.replace(/s$/,'')),A=tk(a),B=tk(b),c=A.filter(w=>B.includes(w)).length;
return Math.max(1-lev(x,y)/Math.max(x.length,y.length),(A.length>1&&B.length>1)?c/Math.min(A.length,B.length):0)}

/* reservations */
function addMiner(it,who){
if(S.res.some(r=>r.item===it.id&&open(r)&&r.who.toLowerCase()===who.toLowerCase())){note(`${who} is already in line for ${it.name}.`);return}
const live=S.res.filter(r=>r.item===it.id&&open(r));
S.res.push({id:S.nid++,item:it.id,who,pos:Math.max(0,...live.map(r=>r.pos))+1,status:live.length?'WAITING':'ACTIVE',exp:live.length?0:Date.now()+24*H})}
function reserve(d,joinId){let it=joinId?item(joinId):null;
if(!it){it={id:S.nid++,name:d.name,photo:d.photo,batch:d.batch,status:'RESERVED'};S.items.push(it)}
d.whos.forEach(w=>addMiner(it,w))}
function resolve(k,id){const d=pend.d;pend=null;if(k==='same')reserve(d,id);if(k==='new')reserve(d);if(k!=='cancel'){photoData='';$('rForm').reset()}commit()}
function addNext(id){const el=$('am'+id),w=el.value.trim();if(!w)return;addMiner(item(id),w);commit()}
function promote(id){const it=item(id),nx=S.res.filter(r=>r.item===id&&r.status==='WAITING').sort((a,b)=>a.pos-b.pos)[0];
if(nx){nx.status='ACTIVE';nx.exp=Date.now()+24*H;note(`Message ${nx.who}: ${it.name} is now available for them. New 24-hour timer started.`)}else it.status='RELEASED'}
function expire(id){const r=S.res.find(x=>x.id===id);r.status='EXPIRED';note(`${r.who}’s reservation for ${item(r.item).name} expired.`);promote(r.item);commit()}
function cancel(id){const r=S.res.find(x=>x.id===id),was=r.status;r.status='CANCELLED';if(was==='ACTIVE')promote(r.item);commit()}

/* sales, returns, credit */
function sellRes(id){const r=S.res.find(x=>x.id===id),p=+$('s'+id).value;if(!(p>0)){$('s'+id).focus();return}
const it=item(r.item),cu=$('c'+id)?+$('c'+id).value:0;r.status='CONFIRMED';it.status='SOLD';
S.res.filter(x=>x.item===it.id&&x.status==='WAITING').forEach(x=>{x.status='CANCELLED';note(`${x.who} was waiting for ${it.name}, which is now sold.`)});
S.sales.unshift({id:S.nid++,item:it.id,who:r.who,price:p,ch:'Online',at:Date.now(),ret:Date.now()+7*DAY,returned:false});
if(cu>0&&cu<=Math.min(bal(r.who),p))S.credits.push({id:S.nid++,who:r.who,amt:-cu,why:'Used on '+it.name,at:Date.now()});commit()}
function ret(id){const s=S.sales.find(x=>x.id===id);s.returned=true;item(s.item).status='RETURNED';note(`${item(s.item).name} was returned by ${s.who}.`);commit()}
function retCr(id){const s=S.sales.find(x=>x.id===id);S.credits.push({id:S.nid++,who:s.who,amt:s.price,why:'Returned '+item(s.item).name,at:Date.now()});ret(id)}
function archive(id){item(id).status='ARCHIVED';commit()}
function useCr(i){const w=crKeys[i],a=+$('u'+i).value;if(!(a>0)||a>bal(w)){$('u'+i).focus();return}S.credits.push({id:S.nid++,who:w,amt:-a,why:'Used in store',at:Date.now()});commit()}

/* rendering */
const th=i=>i.photo?`<img class="th" src="${i.photo}" alt="">`:'<div class="th"></div>';
function render(){
const T=[['res','Reserve'],['q','Queue'],['pos','POS'],['inv','Inventory'],['bat','Batches'],['cr','Store credit']];
$('nav').innerHTML=T.map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="setTab('${k}')">${l}</button>`).join('');
T.forEach(([k])=>$('t-'+k).classList.toggle('show',tab===k));
$('notes').innerHTML=S.notes.slice(0,3).map(n=>`<div class="note">${esc(n)}</div>`).join('')+(S.notes.length?'<button class="sm" onclick="S.notes=[];commit()" style="margin-bottom:12px">Clear notifications</button>':'');
const opts='<option value="0">No batch</option>'+S.batches.map(b=>`<option value="${b.id}">${esc(b.label)}</option>`).join('');
const rv=$('rb').value,wv=$('wb').value;$('rb').innerHTML=opts;$('wb').innerHTML=opts;$('rb').value=rv||'0';$('wb').value=wv||'0';
renderDup();renderQueue();renderPos();renderInv();renderBat();renderCr();tick()}

function renderDup(){$('dup').innerHTML=pend?`<div class="card warn"><h2>A similar shoe is already reserved</h2>
${pend.m.map(id=>{const i=item(id),r=S.res.filter(x=>x.item===id&&open(x));return `<div class="row" style="margin-bottom:10px">${th(i)}<div class="grow"><b>${esc(i.name)}</b><div class="mu">${r.map(x=>esc(x.who)).join(', ')} · ${Math.round(simil(i.name,pend.d.name)*100)}% similar</div></div>
<button class="sm pri" onclick="resolve('same',${id})">Same pair: add to its queue</button></div>`}).join('')}
<div class="row"><button class="sm" onclick="resolve('new')">Different pair: reserve separately</button><button class="sm" onclick="resolve('cancel')">Cancel</button></div></div>`:''}

function renderQueue(){const live=S.items.filter(i=>i.status==='RESERVED');
$('q').innerHTML=live.map(i=>{const rs=S.res.filter(r=>r.item===i.id&&open(r)).sort((a,b)=>a.pos-b.pos);
return `<div class="card"><div class="row" style="margin-bottom:8px">${th(i)}<div class="grow"><b>${esc(i.name)}</b><div class="mu">${i.batch?esc(bat(i.batch).label):'No batch'}</div></div></div>
${rs.map(r=>`<div class="row" style="margin-top:8px"><span class="pill ${r.status==='ACTIVE'?'w':''}">${ord(r.pos)}</span>
<span class="grow"><b>${esc(r.who)}</b>${r.status==='ACTIVE'?` <span class="mu">· ${'time left'} <b class="cd" data-e="${r.exp}"></b></span>`:'<span class="mu"> · waiting</span>'}</span>
${r.status==='ACTIVE'?`<button class="sm pri" onclick="setTab('pos')">Go to POS</button><button class="sm" onclick="expire(${r.id})">Expire now</button>`:''}
<button class="sm" onclick="cancel(${r.id})">Cancel</button></div>`).join('')}
<div class="row" style="margin-top:10px"><input id="am${i.id}" placeholder="Add ${ord(rs.length+1)} miner" style="max-width:200px" onkeydown="if(event.key==='Enter')addNext(${i.id})"><button class="sm" onclick="addNext(${i.id})">Add miner</button></div></div>`}).join('')||empty('Nothing reserved right now.')}

function renderPos(){const act=S.res.filter(r=>r.status==='ACTIVE');
$('posr').innerHTML=act.map(r=>{const i=item(r.item),c=bal(r.who);
return `<div class="card"><div class="row" style="margin-bottom:8px">${th(i)}<div class="grow"><b>${esc(i.name)}</b><div class="mu">Miner: ${esc(r.who)}</div></div></div>
<div class="row"><input id="s${r.id}" class="num" type="number" min="1" placeholder="Sold price" aria-label="Sold price">
${c>0?`<input id="c${r.id}" class="num" type="number" min="0" placeholder="Credit (has ${peso(c)})" aria-label="Store credit used" style="width:170px">`:''}
<span class="grow"></span><button class="pri sm" onclick="sellRes(${r.id})">Record sale</button></div></div>`}).join('')||empty('No reservation is waiting for payment.')}

function renderInv(){const sl=S.sales.filter(s=>!s.returned),rev=sl.reduce((a,s)=>a+s.price,0),cost=S.batches.reduce((a,b)=>a+b.cost,0);
const its=S.items.filter(i=>['SOLD','RETURNED','ARCHIVED'].includes(i.status));
$('inv').innerHTML=`<div class="stats"><div class="card"><div class="mu">Reserved</div><b>${S.items.filter(i=>i.status==='RESERVED').length}</b></div>
<div class="card"><div class="mu">Sold</div><b>${sl.length}</b></div><div class="card"><div class="mu">Revenue</div><b>${peso(rev)}</b></div>
<div class="card"><div class="mu">Cost recovered</div><b>${cost?Math.round(rev/cost*100)+'%':'-'}</b></div></div><h2>Sold and returned</h2>`+
(its.map(i=>{const s=S.sales.find(x=>x.item===i.id),left=s?Math.ceil((s.ret-Date.now())/DAY):0;
return `<div class="card row">${th(i)}<div class="grow"><b>${esc(i.name)}</b><div class="mu">${s?`${s.ch} · ${esc(s.who)} · sold ${peso(s.price)}`:''}</div></div>
<span class="pill ${i.status==='SOLD'?'':'d'}">${i.status.toLowerCase()}</span>
${i.status==='SOLD'&&s.ch==='Online'&&left>0?`<span class="mu">${left}d left to return</span><button class="sm" onclick="ret(${s.id})">Return</button><button class="sm" onclick="retCr(${s.id})">Return as store credit</button>`:''}
${i.status==='SOLD'&&(s.ch==='Walk-in'||left<=0)?`<button class="sm" onclick="archive(${i.id})">Archive</button>`:''}</div>`}).join('')||empty('No sales yet.'))}

function renderBat(){$('bats').innerHTML=S.batches.map(b=>{const a=Math.floor((Date.now()-b.added)/DAY),sl=batSales(b.id),n=sl.length,rem=b.pairs-n,
res=S.items.filter(i=>i.batch===b.id&&i.status==='RESERVED').length,r=sl.reduce((x,s)=>x+s.price,0);
return `<div class="card"><div class="row"><div class="grow"><b>${esc(b.label)}</b> <span class="mu">${a} days old</span></div>
${a>=14&&rem>0?'<span class="pill w">aging</span>':''}${b.cost&&r>=b.cost?'<span class="pill">paid back</span>':''}</div>
<div class="mu">${b.pairs} pairs · cost ${peso(b.cost)} · sold ${n} · reserved ${res} · about ${rem} unsold</div>
<div class="mu">Revenue ${peso(r)} · recovered ${b.cost?Math.round(r/b.cost*100):0}% · ROI ${b.cost?Math.round((r-b.cost)/b.cost*100):0}% · average sold price ${n?peso(Math.round(r/n)):'-'}</div></div>`}).join('')}

function renderCr(){const m={};S.credits.forEach(c=>{const k=c.who.toLowerCase();(m[k]=m[k]||{who:c.who,bal:0,h:[]}).bal+=c.amt;m[k].h.push(c)});
const ps=Object.values(m).sort((a,b)=>b.bal-a.bal),tot=ps.reduce((a,p)=>a+Math.max(0,p.bal),0);crKeys=ps.map(p=>p.who);
$('ppl').innerHTML=ps.map(p=>`<option value="${esc(p.who)}">`).join('');
$('cr').innerHTML=`<div class="stats"><div class="card"><div class="mu">People with credit</div><b>${ps.filter(p=>p.bal>0).length}</b></div><div class="card"><div class="mu">Total credit owed</div><b>${peso(tot)}</b></div></div>`+
(ps.map((p,i)=>`<div class="card"><div class="row"><div class="grow"><b>${esc(p.who)}</b><div class="mu">${p.h.slice().reverse().slice(0,3).map(c=>`${c.amt>0?'+':'−'}${peso(Math.abs(c.amt))} ${esc(c.why||'')}`).join(' · ')}</div></div>
<b>${peso(p.bal)}</b>${p.bal>0?`<input id="u${i}" class="num" type="number" min="1" max="${p.bal}" value="${p.bal}" aria-label="Amount to use"><button class="sm" onclick="useCr(${i})">Use credit</button>`:'<span class="pill">used up</span>'}</div></div>`).join('')||empty('No store credit yet.'))}

function tick(){document.querySelectorAll('.cd').forEach(e=>{const ms=Math.max(0,+e.dataset.e-Date.now());e.textContent=`${Math.floor(ms/H)}h ${Math.floor(ms%H/6e4)}m ${Math.floor(ms%6e4/1e3)}s`})}
setInterval(()=>{const due=S.res.find(r=>r.status==='ACTIVE'&&r.exp<=Date.now());if(due)expire(due.id);else tick()},1000);

/* forms */
$('photo').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,160/im.width);c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);photoData=c.toDataURL('image/jpeg',.6)};im.src=r.result};r.readAsDataURL(f)};
$('rForm').onsubmit=e=>{e.preventDefault();const f=e.target,seen={},
whos=f.miners.value.split(/[\n,]+/).map(s=>s.trim()).filter(s=>s&&!seen[s.toLowerCase()]&&(seen[s.toLowerCase()]=1));
if(!whos.length)return;const d={name:f.iname.value.trim(),whos,photo:photoData,batch:+f.batch.value};
const m=S.items.filter(i=>i.status==='RESERVED'&&simil(i.name,d.name)>=.75);
if(m.length){pend={d,m:m.map(i=>i.id)};render();return}
reserve(d);photoData='';f.reset();commit()};
$('wForm').onsubmit=e=>{e.preventDefault();const f=e.target,it={id:S.nid++,name:f.iname.value.trim(),photo:'',batch:+f.batch.value,status:'SOLD'};S.items.push(it);
S.sales.unshift({id:S.nid++,item:it.id,who:'Walk-in',price:+f.price.value,ch:'Walk-in',at:Date.now(),ret:0,returned:false});f.reset();commit()};
$('bForm').onsubmit=e=>{e.preventDefault();const f=e.target;S.batches.unshift({id:S.nid++,label:f.label.value.trim(),pairs:+f.pairs.value,cost:+f.cost.value,added:Date.now()});f.reset();commit()};
$('cForm').onsubmit=e=>{e.preventDefault();const f=e.target;S.credits.push({id:S.nid++,who:f.who.value.trim(),amt:+f.amt.value,why:f.why.value.trim(),at:Date.now()});f.reset();commit()};
S=load();commit();
</script></body></html>
